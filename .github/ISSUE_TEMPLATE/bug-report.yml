name: Bug report
description: Report a reproducible technical problem.
title: "[Bug]: "
body:
  - type: textarea
    id: observed-behavior
    attributes:
      label: Observed behavior
      description: Describe what happened, including any error messages.
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: Describe what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: reproduction-steps
    attributes:
      label: Steps to reproduce
      description: List the smallest sequence of steps that reproduces the problem.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and context
      description: Include relevant versions, operating system, browser or runtime, and configuration details.
    validations:
      required: true
  - type: checkboxes
    id: acknowledgement
    attributes:
      label: Acknowledgement
      options:
        - label: I have searched existing issues and provided enough information to reproduce this problem.
          required: true
