name: CI

on:
  pull_request:
    branches: [codex/develop]
  push:
    branches: [codex/develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Blocking gate: type errors must not merge. Green on codex/develop today.
  typecheck:
    name: Typecheck (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  # Reporting-only for now: the branch has known lint errors. Does not block.
  # Flip to blocking in a follow-up once the existing errors are fixed.
  lint:
    name: Lint (reporting-only)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
      - run: npm ci
      - run: npm run lint

  # Reporting-only for now: the branch has known failing tests.
  # Excludes tests/integration/** which require a live database CI does not provide.
  # Flip to blocking in a follow-up once the failing suite is triaged.
  test:
    name: Tests (reporting-only, excludes integration)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
      - run: npm ci
      - run: npx vitest run --exclude 'tests/integration/**'
